<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal USB Serial OTG (PC / Android)</title>
  <!-- Tailwind CSS para interfaz gráfica -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Polyfill de WebUSB a WebSerial para Android -->
  <script src="https://unpkg.com/web-serial-polyfill/dist/build/serial.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 flex flex-col items-center">

  <div class="w-full max-w-3xl bg-slate-800 rounded-xl shadow-2xl border border-slate-700 p-6 space-y-6">
    
    <!-- Encabezado e Indicador de Estado -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-700 pb-4">
      <div>
        <h1 class="text-xl font-bold text-white flex items-center gap-2">
          🔌 Comunicación USB Serial
        </h1>
        <p class="text-xs text-slate-400 mt-1">Soporta WebSerial nativo (PC) y WebUSB Polyfill (Android OTG)</p>
      </div>
      <span id="apiModeBadge" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-slate-700 text-slate-300">
        Detectando entorno...
      </span>
    </div>

    <!-- Panel de Control de Conexión -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">1. Emparejar</label>
        <button id="btnPair" onclick="requestNewPort()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 px-3 rounded-lg text-sm transition-colors shadow">
          🔍 Buscar Dispositivo
        </button>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">2. Seleccionar Puerto</label>
        <select id="portsSelect" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          <option value="">Sin dispositivos</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Baud Rate</label>
        <select id="baudRate" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          <option value="9600" selected>9600</option>
          <option value="19200">19200</option>
          <option value="38400">38400</option>
          <option value="57600">57600</option>
          <option value="115200">115200</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">3. Estado</label>
        <button id="btnConnect" onclick="toggleConnect()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 px-3 rounded-lg text-sm transition-colors shadow">
          ⚡ Conectar
        </button>
      </div>
    </div>

    <!-- Consola de Salida -->
    <div>
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Consola de Eventos y Datos</span>
        <button onclick="clearConsole()" class="text-xs text-slate-400 hover:text-slate-200 underline">Limpiar</button>
      </div>
      <div id="logConsole" class="w-full h-64 bg-slate-950 text-emerald-400 font-mono text-xs p-4 rounded-lg overflow-y-auto border border-slate-800 space-y-1"></div>
    </div>

    <!-- Panel de Envío de Datos -->
    <div class="flex gap-2">
      <input type="text" id="txInput" placeholder="Escribe un comando o mensaje..." class="flex-1 bg-slate-900 border border-slate-700 text-slate-100 text-sm rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none" onkeypress="if(event.key==='Enter') sendData()">
      <button onclick="sendData()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-5 py-2 rounded-lg text-sm transition-colors shadow">
        Enviar
      </button>
    </div>

  </div>

  <!-- Lógica JavaScript -->
  <script>
    let serialAPI = null;
    let isAndroidWebUSB = false;
    let activePort = null;
    let reader = null;
    let writer = null;
    let keepReading = false;

    // Inicialización al cargar la página
    document.addEventListener("DOMContentLoaded", () => {
      initSerialAPI();
    });

    // Detecta la API disponible (WebSerial nativo en PC vs WebUSB Polyfill en Android)
    function initSerialAPI() {
      const apiBadge = document.getElementById('apiModeBadge');

      if ("serial" in navigator) {
        serialAPI = navigator.serial;
        isAndroidWebUSB = false;
        apiBadge.innerText = "💻 Web Serial Nativo (Desktop)";
        apiBadge.className = "inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-blue-950 text-blue-300 border border-blue-800";
        log("💻 Entorno Nativo detectado (PC / Laptop).");
        refreshPortsList();

      } else if ("usb" in navigator && window.serialPolyfill) {
        serialAPI = new serialPolyfill.Serial();
        isAndroidWebUSB = true;
        apiBadge.innerText = "📱 WebUSB Polyfill (Android OTG)";
        apiBadge.className = "inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-purple-950 text-purple-300 border border-purple-800";
        log("📱 Entorno Android/Móvil detectado. Activando WebUSB OTG Polyfill.");
        refreshPortsList();

      } else {
        apiBadge.innerText = "⚠️ Navegador No Compatible";
        apiBadge.className = "inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-rose-950 text-rose-300 border border-rose-800";
        log("⚠️ Este navegador no soporta comunicación USB Serial. Utiliza Google Chrome.");
      }
    }

    // Solicita permisos para un nuevo dispositivo USB pasándole filtros de Vendor ID
    async function requestNewPort() {
      if (!serialAPI) return alert("Tu navegador no soporta comunicación USB Serial.");
      try {
        log("🔍 Solicitando selección de dispositivo USB/OTG...");
        
        // Filtros explícitos con los chips convertidores USB-Serial más frecuentes
        const filters = [
          { usbVendorId: 0x0403 }, // FTDI
          { usbVendorId: 0x10c4 }, // Silicon Labs CP210x
          { usbVendorId: 0x1a86 }, // Qinheng CH340 / CH341
          { usbVendorId: 0x067b }, // Prolific PL2303
          { usbVendorId: 0x2341 }, // Arduino
          { usbVendorId: 0x2e8a }, // Raspberry Pi Pico
          { usbVendorId: 0x0483 }  // STMicroelectronics
        ];

        if (isAndroidWebUSB) {
          await serialAPI.requestPort({ filters: filters });
        } else {
          await serialAPI.requestPort();
        }
        
        await refreshPortsList();
        log("✅ Dispositivo emparejado correctamente.");
      } catch (err) { 
        log("❌ Error o selección cancelada: " + err.message); 
      }
    }

    // Actualiza la lista desplegable de dispositivos emparejados
    async function refreshPortsList() {
      if (!serialAPI) return;
      try {
        const ports = await serialAPI.getPorts();
        const select = document.getElementById("portsSelect");
        select.innerHTML = "";

        if (ports.length === 0) {
          select.innerHTML = '<option value="">Sin dispositivos emparejados</option>';
          return;
        }

        ports.forEach((port, index) => {
          const info = port.getInfo ? port.getInfo() : {};
          const vendorStr = info.usbVendorId ? ` VID: 0x${info.usbVendorId.toString(16)}` : '';
          const option = document.createElement("option");
          option.value = index;
          option.textContent = `Dispositivo USB ${index + 1}${vendorStr}`;
          select.appendChild(option);
        });
      } catch (err) {
        log("⚠️ Error listando dispositivos: " + err.message);
      }
    }

    // Conecta o desconecta el puerto seleccionado
    async function toggleConnect() {
      if (activePort) {
        await disconnectPort();
      } else {
        await connectPort();
      }
    }

    async function connectPort() {
      const select = document.getElementById("portsSelect");
      const baudRate = parseInt(document.getElementById("baudRate").value);

      if (select.value === "" || select.value === null) {
        alert("Por favor haz clic en 'Buscar Dispositivo' para emparejar tu conversor USB OTG.");
        return;
      }

      try {
        const ports = await serialAPI.getPorts();
        activePort = ports[select.value];

        log(`⚡ Abriendo puerto a ${baudRate} baudios...`);
        await activePort.open({ baudRate: baudRate });
        
        keepReading = true;
        readLoop();

        const btnConnect = document.getElementById("btnConnect");
        btnConnect.innerText = "🛑 Desconectar";
        btnConnect.className = "w-full bg-rose-600 hover:bg-rose-500 text-white font-medium py-2 px-3 rounded-lg text-sm transition-colors shadow";
        
        log("🚀 Conexión establecida. Escuchando datos de entrada...");
      } catch (err) {
        log("❌ Error al abrir el puerto: " + err.message);
        activePort = null;
      }
    }

    // Bucle continuo de lectura de datos entrantes
    async function readLoop() {
      while (activePort && activePort.readable && keepReading) {
        try {
          reader = activePort.readable.getReader();
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            if (value) {
              const textChunk = new TextDecoder().decode(value);
              log(`📥 RX: ${textChunk}`, "text-emerald-400");
            }
          }
        } catch (err) {
          if (keepReading) log("⚠️ Error de lectura: " + err.message);
        } finally {
          if (reader) {
            reader.releaseLock();
            reader = null;
          }
        }
      }
    }

    // Envío de datos hacia el dispositivo
    async function sendData() {
      const input = document.getElementById("txInput");
      const message = input.value;
      if (!message) return;
      if (!activePort || !activePort.writable) {
        alert("El dispositivo no está conectado.");
        return;
      }

      try {
        const encoder = new TextEncoder();
        const data = encoder.encode(message + "\r\n"); // Agrega salto de línea estándar
        writer = activePort.writable.getWriter();
        await writer.write(data);
        writer.releaseLock();
        writer = null;

        log(`📤 TX: ${message}`, "text-sky-400");
        input.value = "";
      } catch (err) {
        log("❌ Error al enviar datos: " + err.message);
        if (writer) {
          writer.releaseLock();
          writer = null;
        }
      }
    }

    // Cierre seguro del puerto y liberación de recursos
    async function disconnectPort() {
      keepReading = false;

      if (reader) {
        await reader.cancel();
      }

      if (activePort) {
        try {
          await activePort.close();
          log("🔌 Puerto desconectado correctamente.");
        } catch (err) {
          log("⚠️ Error al cerrar puerto: " + err.message);
        }
      }

      activePort = null;
      const btnConnect = document.getElementById("btnConnect");
      btnConnect.innerText = "⚡ Conectar";
      btnConnect.className = "w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 px-3 rounded-lg text-sm transition-colors shadow";
    }

    // Utilidad para imprimir en la consola HTML
    function log(msg, colorClass = "text-emerald-400") {
      const consoleDiv = document.getElementById("logConsole");
      const time = new Date().toLocaleTimeString();
      const line = document.createElement("div");
      line.className = colorClass;
      line.textContent = `[${time}] ${msg}`;
      consoleDiv.appendChild(line);
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    function clearConsole() {
      document.getElementById("logConsole").innerHTML = "";
    }
  </script>
</body>
</html>
